<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="center">

<div class="login-box">
    <h2>SuperMessenger</h2>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <input name="username" placeholder="Enter username" required>
        <button type="submit">Join</button>
    </form>
</div>

</body>
</html>
